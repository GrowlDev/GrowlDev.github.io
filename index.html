<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tyson Young</title>
<meta name="description" content="Tyson Young — developer of Nightcall (working title).">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>&#9608;</text></svg>">
<style>
  :root {
    --bg:      #fbfaf8;
    --ink:     #16150f;
    --muted:   #7d7a70;
    --rule:    #e2dfd7;
    --accent:  #b4491c;
  }
  :root:not([data-theme="light"]) { }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:     #100f0e;
      --ink:    #e9e5dc;
      --muted:  #817d73;
      --rule:   #26241f;
      --accent: #e2803f;
    }
  }
  :root[data-theme="dark"] {
    --bg:     #100f0e;
    --ink:    #e9e5dc;
    --muted:  #817d73;
    --rule:   #26241f;
    --accent: #e2803f;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--ink);
    font: 400 15px/1.65 ui-monospace, "SFMono-Regular", "Cascadia Mono", Menlo, Consolas, monospace;
    margin: 0;
    padding: 14vh 7vw 20vh;
    -webkit-font-smoothing: antialiased;
  }

  main { max-width: 34rem; }

  h1 {
    font-size: 15px;
    font-weight: 400;
    letter-spacing: 0.02em;
    margin: 0 0 2.4rem;
  }

  /* the one flourish: a slow cursor, because the site isn't finished either */
  h1::after {
    content: "";
    display: inline-block;
    width: 0.5em;
    height: 1em;
    margin-left: 0.45em;
    vertical-align: -0.15em;
    background: var(--accent);
    animation: blink 2.4s steps(1) infinite;
  }
  @keyframes blink { 0%, 60% { opacity: 1; } 61%, 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    h1::after { animation: none; opacity: 0.5; }
  }

  p { margin: 0 0 1.1rem; max-width: 30rem; }

  section { margin-top: 3.6rem; }

  h2 {
    font-size: 15px;
    font-weight: 400;
    color: var(--muted);
    margin: 0 0 1.2rem;
    padding-bottom: 0.7rem;
    border-bottom: 1px solid var(--rule);
  }

  ol { list-style: none; margin: 0; padding: 0; counter-reset: n; }
  ol li { counter-increment: n; display: flex; gap: 1.1rem; margin-bottom: 0.9rem; }
  ol li::before {
    content: counter(n, decimal-leading-zero);
    color: var(--muted);
    flex: none;
  }
  .note { color: var(--muted); }

  ul { list-style: none; margin: 0; padding: 0; }
  ul li { margin-bottom: 0.5rem; }

  a {
    color: inherit;
    text-decoration: none;
    border-bottom: 1px solid var(--rule);
    transition: border-color 120ms, color 120ms;
  }
  a:hover, a:focus-visible {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
<main>

  <h1>Tyson Young</h1>

  <p>Developer of Nightcall (Working Title).</p>

  <section>
    <h2>Tools</h2>
    <!-- To add another: copy one <li> block below, change the link and the note.
         The 01/02/03 numbering is automatic, don't type it. -->
    <ol>
      <li>
        <div>
          <a href="https://github.com/GrowlDev/pdn-export-layers">Export Layers to PNGs</a><br>
          <span class="note">A Paint.NET plugin. Exports every layer of a document as a separate PNG.</span>
        </div>
      </li>
    </ol>
  </section>

  <section>
    <h2>Elsewhere</h2>
    <ul>
      <li><a href="https://github.com/GrowlDev">GitHub</a></li>
      <li><a href="https://x.com/GrowlDev">X</a></li>
      <li><a href="https://www.instagram.com/growldev/">Instagram</a></li>
      <li><a href="https://www.reddit.com/user/GrowlDev">Reddit</a></li>
      <li><a href="https://growldev.itch.io">itch.io</a></li>
    </ul>
  </section>

</main>
</body>
</html>
